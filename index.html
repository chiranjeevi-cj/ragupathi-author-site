<!doctype html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vadathinnalur K. Ragupathi | Tamil Poet, Writer &amp; Teacher</title>
  <meta name="description" content="Official website of Vadathinnalur K. Ragupathi (வடதின்னலூர் கா. ரகுபதி), Tamil poet, writer and government school teacher. Author of Naanum Pesuven, Uyir Perum Pookkal and Iruttalla Velichcham." />
  <meta property="og:title" content="வடதின்னலூர் கா. ரகுபதி | Vadathinnalur K. Ragupathi" />
  <meta property="og:description" content="Tamil poet, writer and teacher. Poems, life lessons and guidance for school and college students." />
  <meta property="og:image" content="/assets/img/og.jpg" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#0b1026" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=Inter:wght@400;500;600&family=Mukta+Malar:wght@400;500;700&family=Noto+Serif+Tamil:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="loader" aria-hidden="true">
    <div class="loader-glyph">அ</div>
  </div>

  <div class="cursor-glow" aria-hidden="true"></div>
  <div class="progress" aria-hidden="true"></div>

  <header class="nav">
    <a href="#top" class="brand" aria-label="Home">
      <span class="brand-mark">க.ர</span>
      <span class="brand-name" data-i18n="brand"></span>
    </a>
    <nav class="nav-links" aria-label="Main">
      <a href="#about" data-i18n="nav.about"></a>
      <a href="#books" data-i18n="nav.books"></a>
      <a href="#library" data-i18n="nav.library"></a>
      <a href="#words" data-i18n="nav.words"></a>
      <a href="#journey" data-i18n="nav.journey"></a>
    </nav>
    <div class="nav-actions">
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" data-set-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-set-lang="ta" aria-pressed="false">தமிழ்</button>
        <span class="lang-pill" aria-hidden="true"></span>
      </div>
      <button class="menu-btn" type="button" aria-label="Menu" aria-expanded="false"><span></span><span></span></button>
    </div>
  </header>

  <main id="top">
    <!-- HERO -->
    <section class="hero">
      <canvas class="hero-canvas" aria-hidden="true"></canvas>
      <div class="hero-inner">
        <div class="hero-text">
          <p class="eyebrow reveal" data-i18n="hero.eyebrow"></p>
          <h1 class="hero-title">
            <span class="line"><span class="split" data-i18n="hero.name1"></span></span>
            <span class="line"><span class="split accent" data-i18n="hero.name2"></span></span>
          </h1>
          <p class="hero-lead reveal" data-i18n="hero.lead"></p>
          <div class="hero-cta reveal">
            <a class="btn btn-primary magnetic" href="#library"><span data-i18n="hero.cta1"></span></a>
            <a class="btn btn-ghost magnetic" href="#about"><span data-i18n="hero.cta2"></span></a>
          </div>
        </div>
        <div class="hero-portrait reveal">
          <div class="portrait-ring"></div>
          <div class="portrait-frame tilt">
            <img src="assets/img/author.jpg" alt="Vadathinnalur K. Ragupathi" width="900" height="1300" />
          </div>
          <div class="float-book fb1"><img src="assets/img/cover-naanum.jpg" alt="" /></div>
          <div class="float-book fb2"><img src="assets/img/cover-uyir.jpg" alt="" /></div>
          <div class="float-book fb3"><img src="assets/img/cover-irutalla.jpg" alt="" /></div>
        </div>
      </div>
      <a href="#about" class="scroll-cue" aria-label="Scroll"><span></span></a>
    </section>

    <!-- MARQUEE -->
    <div class="marquee" aria-hidden="true">
      <div class="marquee-track">
        <span>கவிதை</span><i>✦</i><span>Poetry</span><i>✦</i><span>கட்டுரை</span><i>✦</i><span>Essays</span><i>✦</i><span>சிறுகதை</span><i>✦</i><span>Short Stories</span><i>✦</i><span>வழிகாட்டல்</span><i>✦</i><span>Guidance</span><i>✦</i>
        <span>கவிதை</span><i>✦</i><span>Poetry</span><i>✦</i><span>கட்டுரை</span><i>✦</i><span>Essays</span><i>✦</i><span>சிறுகதை</span><i>✦</i><span>Short Stories</span><i>✦</i><span>வழிகாட்டல்</span><i>✦</i><span>Guidance</span><i>✦</i>
      </div>
    </div>

    <!-- ABOUT -->
    <section id="about" class="section about">
      <div class="container about-grid">
        <div class="about-media reveal">
          <div class="about-photo tilt">
            <img src="assets/img/author-2.jpg" alt="Portrait of K. Ragupathi" loading="lazy" width="842" height="1264" />
          </div>
          <div class="about-badge">
            <strong data-count="10" data-suffix="+">0</strong>
            <span data-i18n="about.badge"></span>
          </div>
        </div>
        <div class="about-copy">
          <p class="eyebrow reveal" data-i18n="about.eyebrow"></p>
          <h2 class="section-title reveal" data-i18n="about.title"></h2>
          <p class="reveal" data-i18n="about.p1"></p>
          <p class="reveal" data-i18n="about.p2"></p>
          <p class="reveal" data-i18n="about.p3"></p>
          <ul class="facts reveal">
            <li><span data-i18n="facts.qual.k"></span><strong data-i18n="facts.qual.v"></strong></li>
            <li><span data-i18n="facts.role.k"></span><strong data-i18n="facts.role.v"></strong></li>
            <li><span data-i18n="facts.school.k"></span><strong data-i18n="facts.school.v"></strong></li>
            <li><span data-i18n="facts.home.k"></span><strong data-i18n="facts.home.v"></strong></li>
          </ul>
        </div>
      </div>

      <div class="container stats">
        <div class="stat reveal"><strong data-count="3">0</strong><span data-i18n="stats.books"></span></div>
        <div class="stat reveal"><strong data-count="10" data-suffix="+">0</strong><span data-i18n="stats.years"></span></div>
        <div class="stat reveal"><strong data-count="3">0</strong><span data-i18n="stats.genres"></span></div>
        <div class="stat reveal"><strong data-count="2023">0</strong><span data-i18n="stats.since"></span></div>
      </div>
    </section>

    <!-- WHAT HE WRITES -->
    <section class="section themes">
      <div class="container">
        <p class="eyebrow reveal" data-i18n="themes.eyebrow"></p>
        <h2 class="section-title reveal" data-i18n="themes.title"></h2>
        <div class="theme-grid">
          <article class="theme-card reveal tilt">
            <div class="theme-icon">✒</div>
            <h3 data-i18n="themes.poetry.t"></h3>
            <p data-i18n="themes.poetry.d"></p>
          </article>
          <article class="theme-card reveal tilt">
            <div class="theme-icon">❦</div>
            <h3 data-i18n="themes.essays.t"></h3>
            <p data-i18n="themes.essays.d"></p>
          </article>
          <article class="theme-card reveal tilt">
            <div class="theme-icon">☀</div>
            <h3 data-i18n="themes.guide.t"></h3>
            <p data-i18n="themes.guide.d"></p>
          </article>
          <article class="theme-card reveal tilt">
            <div class="theme-icon">❧</div>
            <h3 data-i18n="themes.stories.t"></h3>
            <p data-i18n="themes.stories.d"></p>
          </article>
        </div>
      </div>
    </section>

    <!-- BOOKS -->
    <section id="books" class="section books">
      <div class="container">
        <p class="eyebrow reveal" data-i18n="books.eyebrow"></p>
        <h2 class="section-title reveal" data-i18n="books.title"></h2>
        <p class="section-sub reveal" data-i18n="books.sub"></p>
        <div class="book-list" id="bookList"></div>
      </div>
    </section>

    <!-- LIBRARY -->
    <section id="library" class="section library">
      <div class="container">
        <p class="eyebrow reveal" data-i18n="library.eyebrow"></p>
        <h2 class="section-title reveal" data-i18n="library.title"></h2>
        <p class="section-sub reveal" data-i18n="library.sub"></p>
        <div class="shelf" id="shelf"></div>
      </div>
    </section>

    <!-- WORDS / EXCERPTS -->
    <section id="words" class="section words">
      <div class="container">
        <p class="eyebrow reveal" data-i18n="words.eyebrow"></p>
        <h2 class="section-title reveal" data-i18n="words.title"></h2>
        <div class="quote-stage reveal">
          <div class="quote-slides" id="quoteSlides"></div>
          <div class="quote-dots" id="quoteDots" role="tablist"></div>
        </div>
      </div>
    </section>

    <!-- JOURNEY -->
    <section id="journey" class="section journey">
      <div class="container">
        <p class="eyebrow reveal" data-i18n="journey.eyebrow"></p>
        <h2 class="section-title reveal" data-i18n="journey.title"></h2>
        <ol class="timeline">
          <li class="reveal"><span class="t-year" data-i18n="journey.1.y"></span><div><h3 data-i18n="journey.1.t"></h3><p data-i18n="journey.1.d"></p></div></li>
          <li class="reveal"><span class="t-year">2023</span><div><h3 data-i18n="journey.2.t"></h3><p data-i18n="journey.2.d"></p></div></li>
          <li class="reveal"><span class="t-year">2025</span><div><h3 data-i18n="journey.3.t"></h3><p data-i18n="journey.3.d"></p></div></li>
          <li class="reveal"><span class="t-year">2026</span><div><h3 data-i18n="journey.4.t"></h3><p data-i18n="journey.4.d"></p></div></li>
        </ol>
      </div>
    </section>

    <!-- PRAISE -->
    <section class="section praise">
      <div class="container">
        <p class="eyebrow reveal" data-i18n="praise.eyebrow"></p>
        <h2 class="section-title reveal" data-i18n="praise.title"></h2>
        <div class="praise-grid">
          <figure class="praise-card reveal">
            <blockquote data-i18n="praise.1.q"></blockquote>
            <figcaption><strong data-i18n="praise.1.n"></strong><span data-i18n="praise.1.r"></span></figcaption>
          </figure>
          <figure class="praise-card reveal">
            <blockquote data-i18n="praise.2.q"></blockquote>
            <figcaption><strong data-i18n="praise.2.n"></strong><span data-i18n="praise.2.r"></span></figcaption>
          </figure>
          <figure class="praise-card reveal">
            <blockquote data-i18n="praise.3.q"></blockquote>
            <figcaption><strong data-i18n="praise.3.n"></strong><span data-i18n="praise.3.r"></span></figcaption>
          </figure>
        </div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <p class="footer-quote" data-i18n="footer.quote"></p>
      <p class="footer-copy">© <span id="year"></span> <span data-i18n="brand"></span>. <span data-i18n="footer.rights"></span></p>
    </div>
  </footer>

  <!-- Book modal -->
  <div class="modal" id="bookModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <button class="modal-close" type="button" data-close aria-label="Close">×</button>
      <div class="modal-cover"><img id="modalCover" alt="" /></div>
      <div class="modal-body">
        <p class="eyebrow" id="modalGenre"></p>
        <h3 id="modalTitle"></h3>
        <p class="modal-translit" id="modalTranslit"></p>
        <p id="modalDesc"></p>
        <blockquote id="modalExcerpt"></blockquote>
        <dl id="modalMeta"></dl>
        <button class="btn btn-primary modal-read" type="button" id="modalRead"><span data-i18n="read.now"></span></button>
      </div>
    </div>
  </div>

  <!-- Book reader -->
  <div class="reader" id="reader" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Book reader">
    <div class="reader-top">
      <div class="reader-title">
        <strong id="readerTitle"></strong>
        <span id="readerCount"></span>
      </div>
      <div class="reader-tools">
        <button type="button" class="r-btn" id="readerZoom" aria-label="Zoom" title="Zoom">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg>
        </button>
        <button type="button" class="r-btn" id="readerFull" aria-label="Full screen" title="Full screen">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <button type="button" class="r-btn" id="readerClose" aria-label="Close" title="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
    <div class="reader-stage" id="readerStage">
      <div class="spread" id="spread">
        <div class="leaf-slot left" id="slotL"><img alt="" /></div>
        <div class="leaf-slot right" id="slotR"><img alt="" /></div>
      </div>
    </div>
    <button type="button" class="r-nav prev" id="readerPrev" aria-label="Previous page">‹</button>
    <button type="button" class="r-nav next" id="readerNext" aria-label="Next page">›</button>
    <div class="reader-bottom">
      <input type="range" id="readerRange" min="0" value="0" aria-label="Page" />
    </div>
  </div>

  <script src="main.js" defer></script>
</body>
</html>
